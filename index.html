<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>VOIDWALKER</title>
<style>
html,body{
    margin:0;
        overflow:hidden;
            background:#050010;
                font-family:Arial,sans-serif;
                }
                canvas{
                    display:block;
                        margin:0 auto;
                            background:#0a0010;
                            }
                            </style>
                            </head>
                            <body>
                            <canvas id="game"></canvas>

                            <script>
                            // <!-- INSERT CRAZYGAMES SDK HERE -->

                            const canvas = document.getElementById('game');
                            const ctx = canvas.getContext('2d');

                            const DPR = window.devicePixelRatio || 1;
                            canvas.width = 900 * DPR;
                            canvas.height = 520 * DPR;
                            canvas.style.width = '900px';
                            canvas.style.height = '520px';
                            ctx.scale(DPR,DPR);

                            const WIDTH = 900;
                            const HEIGHT = 520;

                            let last = 0;
                            let cameraX = 0;
                            let currentStage = 1;

                            const keys = {};

                            window.addEventListener('keydown',e=>keys[e.key.toLowerCase()] = true);
                            window.addEventListener('keyup',e=>keys[e.key.toLowerCase()] = false);

                            const player = {
                                x:180,
                                    y:380,
                                        w:36,
                                            h:52,
                                                vx:0,
                                                    vy:0,
                                                        grounded:false,
                                                            hp:5,
                                                                lives:3,
                                                                    score:0,
                                                                        coins:0,
                                                                            direction:1,
                                                                                skin:0
                                                                                };

                                                                                const skins = [
                                                                                {
                                                                                helmet:'#4a90d9',
                                                                                armor:'#2c5f8a',
                                                                                visor:'#1a3a5c',
                                                                                energy:'#00cfff'
                                                                                },
                                                                                {
                                                                                helmet:'#c0392b',
                                                                                armor:'#8b1a1a',
                                                                                visor:'#4a0000',
                                                                                energy:'#ff6600'
                                                                                },
                                                                                {
                                                                                helmet:'rgba(180,240,255,0.85)',
                                                                                armor:'rgba(200,240,255,0.7)',
                                                                                visor:'rgba(0,180,220,0.9)',
                                                                                energy:'#ffffff'
                                                                                }
                                                                                ];

                                                                                const stages = {
                                                                                1:{
                                                                                name:'NEON RUINS',
                                                                                width:3800,
                                                                                background:'#0a0020',
                                                                                platforms:[
                                                                                {x:0,y:460,w:3800,h:60},
                                                                                {x:300,y:370,w:200,h:18},
                                                                                {x:580,y:300,w:160,h:18},
                                                                                {x:800,y:360,w:280,h:18},
                                                                                {x:1100,y:280,w:180,h:18},
                                                                                {x:1350,y:340,w:240,h:18}
                                                                                ],
                                                                                portals:[
                                                                                {x:600,y:340,to:2,color:'#c0392b'},
                                                                                {x:2400,y:290,to:3,color:'#00bcd4'}
                                                                                ],
                                                                                enemies:[
                                                                                {x:500,y:420,type:'drone'},
                                                                                {x:800,y:420,type:'drone'}
                                                                                ],
                                                                                crystal:{x:3600,y:400,collected:false}
                                                                                },
                                                                                2:{
                                                                                name:'LAVA FORGE',
                                                                                width:4200,
                                                                                background:'#220000',
                                                                                platforms:[
                                                                                {x:0,y:460,w:4200,h:60},
                                                                                {x:400,y:360,w:200,h:18},
                                                                                {x:700,y:280,w:220,h:18}
                                                                                ],
                                                                                portals:[
                                                                                {x:500,y:330,to:1,color:'#4a90d9'}
                                                                                ],
                                                                                enemies:[
                                                                                {x:900,y:420,type:'golem'}
                                                                                ],
                                                                                crystal:{x:4000,y:380,collected:false}
                                                                                }
                                                                                };

                                                                                function rectsCollide(a,b){
                                                                                return a.x < b.x + b.w &&
                                                                                       a.x + a.w > b.x &&
                                                                                              a.y < b.y + b.h &&
                                                                                                     a.y + a.h > b.y;
                                                                                                     }

                                                                                                     function update(dt){

                                                                                                         const moveSpeed = 0.8;
                                                                                                             const gravity = currentStage===5 ? 0.4 : 0.8;

                                                                                                                 if(keys['a'] || keys['arrowleft']){
                                                                                                                         player.vx -= moveSpeed;
                                                                                                                                 player.direction = -1;
                                                                                                                                     }

                                                                                                                                         if(keys['d'] || keys['arrowright']){
                                                                                                                                                 player.vx += moveSpeed;
                                                                                                                                                         player.direction = 1;
                                                                                                                                                             }

                                                                                                                                                                 if((keys[' '] || keys['w'] || keys['arrowup']) && player.grounded){
                                                                                                                                                                         player.vy = currentStage===5 ? -10 : -14;
                                                                                                                                                                                 player.grounded = false;
                                                                                                                                                                                     }

                                                                                                                                                                                         player.vx *= 0.9;
                                                                                                                                                                                             player.vy += gravity;

                                                                                                                                                                                                 player.x += player.vx;
                                                                                                                                                                                                     player.y += player.vy;

                                                                                                                                                                                                         player.grounded = false;

                                                                                                                                                                                                             const stage = stages[currentStage];

                                                                                                                                                                                                                 for(const p of stage.platforms){

                                                                                                                                                                                                                         const box = {
                                                                                                                                                                                                                                     x:player.x,
                                                                                                                                                                                                                                                 y:player.y,
                                                                                                                                                                                                                                                             w:player.w,
                                                                                                                                                                                                                                                                         h:player.h
                                                                                                                                                                                                                                                                                 };

                                                                                                                                                                                                                                                                                         if(rectsCollide(box,p)){

                                                                                                                                                                                                                                                                                                     if(player.vy > 0 && player.y + player.h < p.y + 20){
                                                                                                                                                                                                                                                                                                                     player.y = p.y - player.h;
                                                                                                                                                                                                                                                                                                                                     player.vy = 0;
                                                                                                                                                                                                                                                                                                                                                     player.grounded = true;
                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                 for(const portal of stage.portals){
                                                                                                                                                                                                                                                                                                                                                                                         const dx = player.x - portal.x;
                                                                                                                                                                                                                                                                                                                                                                                                 const dy = player.y - portal.y;
                                                                                                                                                                                                                                                                                                                                                                                                         const dist = Math.hypot(dx,dy);

                                                                                                                                                                                                                                                                                                                                                                                                                 if(dist < 60 && keys['e']){
                                                                                                                                                                                                                                                                                                                                                                                                                             loadStage(portal.to);
                                                                                                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                                                                                                                                                                                                                             cameraX += ((player.x - WIDTH/2) - cameraX) * 0.08;

                                                                                                                                                                                                                                                                                                                                                                                                                                                 cameraX = Math.max(0,Math.min(cameraX,stage.width - WIDTH));
                                                                                                                                                                                                                                                                                                                                                                                                                                                 }

                                                                                                                                                                                                                                                                                                                                                                                                                                                 function drawBackground(stage){

                                                                                                                                                                                                                                                                                                                                                                                                                                                     const grad = ctx.createLinearGradient(0,0,0,HEIGHT);
                                                                                                                                                                                                                                                                                                                                                                                                                                                         grad.addColorStop(0,'#050010');
                                                                                                                                                                                                                                                                                                                                                                                                                                                             grad.addColorStop(1,stage.background);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.fillStyle = grad;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillRect(0,0,WIDTH,HEIGHT);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                         for(let i=0;i<120;i++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.fillStyle = 'white';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.globalAlpha = Math.random();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.fillRect((i*97)%WIDTH,(i*37)%HEIGHT,2,2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.globalAlpha = 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         function drawPlatforms(stage){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             for(const p of stage.platforms){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillStyle = '#1e0840';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillRect(p.x,p.y,p.w,p.h);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillStyle = '#00cfff';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillRect(p.x,p.y,p.w,2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 function drawPlayer(){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     const skin = skins[player.skin];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.save();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.translate(player.x + player.w/2, player.y + player.h/2);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 if(player.direction < 0){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.scale(-1,1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.fillStyle = skin.armor;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillRect(-13,-6,26,18);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.fillStyle = skin.helmet;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.ellipse(0,-18,16,13,0,0,Math.PI*2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fill();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.fillStyle = skin.visor;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillRect(-10,-22,20,7);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.fillStyle = skin.armor;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillRect(-20,-4,7,16);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.fillRect(13,-4,7,16);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillRect(-12,12,10,20);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.fillRect(2,12,10,20);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillStyle = '#0f1e2e';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.fillRect(-14,28,12,10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillRect(0,28,12,10);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 for(let i=0;i<5;i++){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.globalAlpha = 0.5 - i*0.08;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.fillStyle = skin.energy;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.ellipse(-10-(i*10),0,4-i*0.5,6-i*0.5,0,0,Math.PI*2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.fill();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.restore();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.globalAlpha = 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     function drawEnemies(stage){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         for(const e of stage.enemies){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 if(e.type==='drone'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fillStyle='#1a1a3a';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.fillRect(e.x,e.y,40,28);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillStyle='red';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.arc(e.x+12,e.y+10,4,0,Math.PI*2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.fill();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.arc(e.x+28,e.y+10,4,0,Math.PI*2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.fill();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             if(e.type==='golem'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.fillStyle='#3d0800';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.fillRect(e.x,e.y,46,58);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.strokeStyle='#ff6600';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ctx.moveTo(e.x+5,e.y+10);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.lineTo(e.x+40,e.y+40);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ctx.stroke();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             function drawPortals(stage){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 const t = performance.now()*0.001;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     for(const portal of stage.portals){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.save();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ctx.translate(portal.x,portal.y);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ctx.rotate(t);
